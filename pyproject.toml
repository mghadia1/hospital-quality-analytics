[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-quality-analytics"
version = "0.1.0"
description = "What CMS hospital star ratings do and do not tell you: coverage, ownership, state variation, and readmissions"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
hospital-quality = "hospital_quality.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hospital_quality = ["sql/*.sql"]

[tool.pytest.ini_options]
pythonpath = ["src"]
